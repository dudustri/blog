<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 566" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><rect x="0" y="0" width="720" height="566" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect x="30" y="40" width="380" height="52" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="220" y="60" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">official client exe</text><text x="220" y="78" text-anchor="middle" font-size="10.5" fill="#6b7280">a 2026 build, 32 bit Windows, Korean</text><line x1="220" y1="92" x2="220" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><text x="228" y="114" text-anchor="start" font-size="9.5" fill="#6b7280">WARP patch session</text><rect x="30" y="128" width="380" height="70" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="220" y="148" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">patched exe</text><text x="220" y="166" text-anchor="middle" font-size="10.5" fill="#6b7280">local files before the GRF archives,</text><text x="220" y="181" text-anchor="middle" font-size="10.5" fill="#6b7280">no anti cheat, our server address</text><line x1="220" y1="198" x2="220" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><text x="228" y="219" text-anchor="start" font-size="9.5" fill="#6b7280">boot</text><rect x="30" y="232" width="380" height="124" rx="10" fill="#fbfcfd" stroke="#d1d5db" stroke-dasharray="5 4"/><text x="220" y="250" text-anchor="middle" font-size="10.5" fill="#6b7280">what the client loads at boot</text><text x="48" y="272" font-size="11"><tspan fill="#3e6b89" font-weight="600">data.grf</tspan><tspan dx="8" fill="#6b7280">archive format 0x200 / 0x300</tspan></text><text x="48" y="294" font-size="11"><tspan fill="#3e6b89" font-weight="600">System/itemInfo.lub</tspan><tspan dx="8" fill="#6b7280">32 bit Lua bytecode, Korean</tspan></text><text x="48" y="316" font-size="11"><tspan fill="#3e6b89" font-weight="600">the English table</tspan><tspan dx="8" fill="#6b7280">sits in the folder, never read</tspan></text><line x1="220" y1="356" x2="220" y2="392" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><text x="228" y="378" text-anchor="start" font-size="9.5" fill="#6b7280">the fix</text><rect x="30" y="392" width="380" height="132" rx="8" fill="#edf3f7" stroke="#3e6b89" stroke-width="1.5"/><text x="220" y="416" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3e6b89">itemInfo.lub becomes a loader</text><text x="48" y="442" font-size="11"><tspan fill="#3e6b89" font-weight="600">1</tspan><tspan dx="8" fill="#6b7280">run the original bytecode</tspan></text><text x="48" y="464" font-size="11"><tspan fill="#3e6b89" font-weight="600">2</tspan><tspan dx="8" fill="#6b7280">overlay the English table</tspan></text><text x="48" y="486" font-size="11"><tspan fill="#3e6b89" font-weight="600">3</tspan><tspan dx="8" fill="#6b7280">append our custom items</tspan></text><text x="220" y="508" text-anchor="middle" font-size="10" fill="#6b7280">27,000+ items in 0.5 s, checked in a 32 bit Lua container</text><rect x="434" y="40" width="262" height="250" rx="10" fill="#fbfcfd" stroke="#d1d5db" stroke-dasharray="5 4"/><text x="565" y="58" text-anchor="middle" font-size="10.5" fill="#6b7280">what the other side demanded</text><text x="450" y="82" font-size="11" fill="#3e6b89" font-weight="600">packet version</text><text x="450" y="97" font-size="10" fill="#6b7280">the exe build date has to</text><text x="450" y="111" font-size="10" fill="#6b7280">match the server build</text><text x="450" y="134" font-size="11" fill="#3e6b89" font-weight="600">cash shop prices</text><text x="450" y="149" font-size="10" fill="#6b7280">the exe expects preview data</text><text x="450" y="163" font-size="10" fill="#6b7280">in every shop entry</text><text x="450" y="186" font-size="11" fill="#3e6b89" font-weight="600"># commands</text><text x="450" y="201" font-size="10" fill="#6b7280">the client drops chat lines</text><text x="450" y="215" font-size="10" fill="#6b7280">starting with #, so ! it is</text><text x="450" y="238" font-size="11" fill="#3e6b89" font-weight="600">account settings</text><text x="450" y="253" font-size="10" fill="#6b7280">newer clients read them from</text><text x="450" y="267" font-size="10" fill="#6b7280">a separate web service</text><rect x="434" y="310" width="262" height="214" rx="10" fill="#fbfcfd" stroke="#d1d5db" stroke-dasharray="5 4"/><text x="565" y="328" text-anchor="middle" font-size="10.5" fill="#6b7280">tools I ended up writing</text><text x="450" y="352" font-size="11" fill="#3e6b89" font-weight="600">GRF reader</text><text x="450" y="367" font-size="10" fill="#6b7280">small Python reader for the</text><text x="450" y="381" font-size="10" fill="#6b7280">0x200 and 0x300 archives</text><text x="450" y="406" font-size="11" fill="#3e6b89" font-weight="600">32 bit Lua container</text><text x="450" y="421" font-size="10" fill="#6b7280">the bytecode is 32 bit, so the</text><text x="450" y="435" font-size="10" fill="#6b7280">test runtime had to be too</text><text x="450" y="460" font-size="11" fill="#3e6b89" font-weight="600">English client</text><text x="450" y="475" font-size="10" fill="#6b7280">community translation, minus</text><text x="450" y="489" font-size="10" fill="#6b7280">the table index is nil crashes</text></svg>