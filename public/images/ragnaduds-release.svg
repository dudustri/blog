<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><rect x="0" y="0" width="720" height="450" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><text x="360" y="26" text-anchor="middle" font-size="11" fill="#6b7280">every arrow below is one duds.sh command</text><rect x="14" y="44" width="272" height="358" rx="10" fill="#fbfcfd" stroke="#d1d5db" stroke-dasharray="5 4"/><text x="150" y="62" text-anchor="middle" font-size="10.5" fill="#6b7280">my PC (amd64)</text><rect x="434" y="44" width="272" height="358" rx="10" fill="#fbfcfd" stroke="#d1d5db" stroke-dasharray="5 4"/><text x="570" y="62" text-anchor="middle" font-size="10.5" fill="#6b7280">Oracle Cloud VM (arm64)</text><rect x="24" y="76" width="250" height="56" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="149" y="96" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">docker buildx + QEMU</text><text x="149" y="114" text-anchor="middle" font-size="10.5" fill="#6b7280">amd64 and arm64 in one go</text><rect x="446" y="76" width="250" height="56" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="571" y="96" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">docker compose pull</text><text x="571" y="114" text-anchor="middle" font-size="10.5" fill="#6b7280">no source code on the VM</text><rect x="24" y="160" width="250" height="64" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="149" y="180" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">per host config folder</text><text x="149" y="198" text-anchor="middle" font-size="10.5" fill="#6b7280">.env secrets, rates, scripts</text><text x="149" y="213" text-anchor="middle" font-size="10.5" fill="#6b7280">never in an image or in git</text><rect x="446" y="160" width="250" height="64" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="571" y="180" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">runtime mounts</text><text x="571" y="198" text-anchor="middle" font-size="10.5" fill="#6b7280">a rate change needs</text><text x="571" y="213" text-anchor="middle" font-size="10.5" fill="#6b7280">no rebuild</text><rect x="24" y="252" width="250" height="56" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="149" y="272" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">backups on my PC</text><text x="149" y="290" text-anchor="middle" font-size="10.5" fill="#6b7280">one command, any time</text><rect x="446" y="252" width="250" height="56" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="571" y="272" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">cron every 6 hours</text><text x="571" y="290" text-anchor="middle" font-size="10.5" fill="#6b7280">keeps 7 days on the VM</text><rect x="24" y="332" width="250" height="56" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="149" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">local accounts file</text><text x="149" y="370" text-anchor="middle" font-size="10.5" fill="#6b7280">plain text, git ignored</text><rect x="446" y="332" width="250" height="56" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/><text x="571" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">game accounts</text><text x="571" y="370" text-anchor="middle" font-size="10.5" fill="#6b7280">created if missing</text><rect x="292" y="76" width="136" height="56" rx="8" fill="#edf3f7" stroke="#3e6b89" stroke-width="1.5"/><text x="360" y="96" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3e6b89">GHCR</text><text x="360" y="114" text-anchor="middle" font-size="10.5" fill="#6b7280">private registry</text><line x1="274" y1="104" x2="292" y2="104" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><line x1="428" y1="104" x2="446" y2="104" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><text x="360" y="150" text-anchor="middle" font-size="9.5" fill="#6b7280">:latest and :&lt;git sha&gt;</text><line x1="274" y1="192" x2="446" y2="192" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><text x="360" y="184" text-anchor="middle" font-size="10" fill="#3e6b89" font-weight="600">up vm</text><text x="360" y="208" text-anchor="middle" font-size="9.5" fill="#6b7280">rsync over ssh</text><line x1="446" y1="280" x2="274" y2="280" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><text x="360" y="272" text-anchor="middle" font-size="10" fill="#3e6b89" font-weight="600">backup</text><text x="360" y="296" text-anchor="middle" font-size="9.5" fill="#6b7280">mariadb-dump over ssh</text><line x1="274" y1="360" x2="446" y2="360" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><text x="360" y="352" text-anchor="middle" font-size="10" fill="#3e6b89" font-weight="600">accounts</text><text x="360" y="376" text-anchor="middle" font-size="9.5" fill="#6b7280">idempotent SQL over ssh</text><text x="360" y="60" text-anchor="middle" font-size="10" fill="#3e6b89" font-weight="600">release</text><text x="360" y="424" text-anchor="middle" font-size="10" fill="#6b7280">a rollback is a tag change, not a rebuild</text></svg>